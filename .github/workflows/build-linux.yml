name: Build Linux

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Glyphore.csproj
      - name: Publish
        run: dotnet publish Glyphore.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -o ./dist/linux-x64
      - name: Package
        run: |
          cd dist/linux-x64
          zip -q -r ../Glyphore-6.0.1-linux-x64.zip .
